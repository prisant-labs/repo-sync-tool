# cargo-audit configuration for RepoSync.
#
# This file exists so the CI advisory gate can FAIL on any NEW vulnerability while
# a small, explicitly documented set of existing ones is temporarily tolerated. An
# ignore here is a debt with an owner and an expiry, not a dismissal.
#
# Rules for adding an entry to `ignore` below:
#   1. State the reachability argument. "Probably fine" is not one.
#   2. Name who owns getting rid of it.
#   3. Give a review date. Past that date the entry is re-argued or removed, not
#      silently renewed.
#   4. If the fix is available and simply not taken yet, say so plainly.
#
# Run locally with `cargo audit`. CI runs the same command on every pull request
# and weekly on a schedule, so a newly published advisory against an unchanged
# lockfile still turns CI red.

[advisories]
# History: empty from 2026-11-02 to 2026-11-15. The previous two entries,
# RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (quick-xml 0.39.4, two denial-of-service
# parser advisories reached only through Tauri's plist handling), were removed when
# plist 1.10.3 brought quick-xml 0.42.0, past the fixed 0.41.0. They were removed
# at their review date, as the rules above require, rather than renewed.
#
# RUSTSEC-2026-0459 (CVE-2026-119375): bundled SQLite before 3.54.0 can return
# uninitialized page-cache memory when it opens a database together with a crafted
# `-wal` file whose page size differs from the database's.
#   - Where it comes from: libsqlite3-sys 0.37.0, built with the `bundled` feature
#     through sqlx's `sqlite` feature. The fix is libsqlite3-sys >= 0.39.0.
#   - Reachability: RepoSync opens exactly one SQLite database, its own
#     `reposync.db` in the per-user data directory (crates/reposync-core/src/paths.rs:
#     %LOCALAPPDATA% on Windows, ~/Library/Application Support on macOS). Every
#     `open_pool` call outside tests goes through `AppPaths::db_path()` or the
#     fresh-database path beside it (crates/reposync-core/src/db.rs). No command
#     opens a database file a user or another program supplies. Planting a crafted
#     database and `-wal` pair there needs write access to the user's own profile,
#     which already gives an attacker more than this flaw does.
#   - Fix available but not takeable: sqlx 0.9.0, the newest release, caps
#     libsqlite3-sys below 0.38. Upstream raised the cap to allow 0.39 in
#     launchbadge/sqlx#4502 (merged 2026-11-08), which is not yet in a release.
#   - Owner: JP (jprisant). Remove this entry by bumping sqlx as soon as a release
#     carrying sqlx#4502 is published.
#   - Review date: 2027-01-15, or the next sqlx release, whichever comes first.
ignore = ["RUSTSEC-2026-0459"]
