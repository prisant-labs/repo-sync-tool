# RepoSync release workflow.
#
# Fires ONLY on version tags (v*), so it never runs on a normal push. On a tag it
# builds Windows + macOS with the full-LTO `dist` profile and creates a DRAFT
# GitHub Release with both platform artifacts attached. A human reviews and
# publishes the draft (see docs/internal/release-plans/runbook_cut-tag-release.md, G4).
#
# ONE version, BOTH platforms: the version stamped into the bundles comes from
# src-tauri/tauri.conf.json (set by scripts/bump-version.mjs). The platform lives
# in the artifact filename, not the version.
#
# E-18 AUTO-UPDATE (auto-update and distribution):
#   - The updater is SIGNED IN CI ONLY. The production private key + password live
#     ONLY in the GitHub Actions secrets TAURI_SIGNING_PRIVATE_KEY [+ _PASSWORD];
#     no agent ever holds them (EXECUTION.md human-only). The public key is committed
#     in src-tauri/tauri.conf.json (plugins.updater.pubkey).
#   - SHIP-DARK-SAFE: the committed tauri.conf.json keeps bundle.createUpdaterArtifacts
#     OFF, so keyless builds (per-push CI's `pnpm tauri build`, and this workflow when
#     the signing secret is absent) never hit the "signing key required" bundle
#     failure. When TAURI_SIGNING_PRIVATE_KEY is present, the "Compute updater build
#     args" step below merges the release overlay (src-tauri/tauri.updater-prod.conf.json)
#     via --config, which flips createUpdaterArtifacts ON so the bundler produces the
#     signed updater artifacts (.sig files) and tauri-action generates + attaches
#     latest.json (Tauri v2 format). Absent the secret, the updater ships DARK and this
#     workflow still produces the plain installers.
#   - Verify the exact tauri-action updater inputs (how it emits + attaches latest.json,
#     and that the manifest references the NSIS artifact) against the action's current
#     README before the first real cut. The runbook's G3 checks for latest.json on the
#     draft's assets; G4 smoke-tests the update check.
#
# NOT WIRED YET (intentional):
#   - macOS code signing + notarization (human-only per EXECUTION.md). macOS
#     artifacts here are UNSIGNED (Apple codesign). Say so in the Release notes. The
#     updater's minisign signature is SEPARATE and IS applied to the macOS updater
#     artifact when the signing secret is present (it is not Apple signing).

name: Release

# TWO ENTRY POINTS, and only one of them can publish anything.
#
#   push: tags v*      -> the real cut. preflight, then build, then a DRAFT Release.
#   workflow_dispatch  -> a DRY RUN. preflight, then build and bundle on both
#                         platforms, and nothing else. No Release, no asset upload,
#                         no tag.
#
# The dry run exists because this workflow had never completed a single run. The only
# Release run in this repo's history is the v0.9.0 tag on 2026-07-05, which failed in
# four seconds with zero steps executed (the Actions billing gate on the old personal
# account, resolved by the move to the paid org). So the installers attached to that
# release were not produced by this pipeline, no macOS artifact has ever been produced
# by it, and the entire preflight job below has never executed once. It is a gate that
# has never been made to pass, let alone made to fail.
#
# WHY THE DISPATCH HAS NO `dry_run` INPUT. It was designed with a boolean input
# defaulting to true. A boolean is a thing that can be flipped, and the only reason to
# flip it would be to publish a release from a manual dispatch, which is exactly what
# the tag-only trigger exists to prevent. Making the TRIGGER the mode removes the
# switch instead of defaulting it: `github.event_name` cannot be set by whoever starts
# the run, so there is no configuration in which a dispatch publishes.
#
# The dry run deliberately shares ONE code path with the real cut rather than being a
# parallel copy. A separate dry-run job would prove that the copy works, which is not
# the thing in doubt. The two diverge at exactly one step in each job, both guarded on
# `github.event_name`.

on:
  push:
    tags:
      - 'v*'
  # Always a dry run. See the note above.
  workflow_dispatch:

# Read by default. Only the job that can create a Release is granted write, so
# preflight (which does the bulk of the work) and every dry run are structurally
# incapable of publishing rather than merely declining to.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------------------------
  # PREFLIGHT - the gate that must pass before a tag is allowed to build.
  #
  # Before this job existed, pushing a tag went STRAIGHT to the build matrix. That meant a tag
  # could cut a release from a commit that never passed CI, that was not reachable from
  # protected main, or whose stamped version disagreed with the tag - and the first sign of
  # trouble would be a published artifact.
  #
  # Two classes of check live here, and only one of them is a duplicate of CI:
  #
  #   1. TAG-SPECIFIC checks that CI structurally cannot make, because CI never sees a tag:
  #      ancestry from main, version alignment across all four declaration sites, a changelog
  #      section, and the updater config-hygiene gate.
  #   2. The standard quality gates. Yes, CI ran these on the commit. Re-running them here is
  #      deliberate: branch protection guarantees main's TIP is green, not that some arbitrary
  #      tagged commit is, and a tag can point anywhere.
  #
  # If this job fails, no artifact is built and no draft release is created.
  # ------------------------------------------------------------------------------------------
  preflight:
    name: release preflight
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the ancestry check below needs to walk from the tag to main.
          fetch-depth: 0

      # --- Which version is under test ----------------------------------------------------
      # On a tag the version comes FROM the tag, and the checks below prove the four
      # declaration sites agree with it. On a dry run there is no tag, so tauri.conf.json
      # (the file the bundler actually stamps into the artifact) becomes the reference and
      # the other three are proven to agree with IT.
      #
      # Be clear about what that costs: on a dry run the tauri.conf.json comparison is a
      # tautology, so the dry run proves the four sites are CONSISTENT and cannot prove
      # they match a tag nobody has pushed yet. That is the one part of this gate a dry
      # run structurally cannot reach, and the summary at the end of this job says so out
      # loud rather than letting a green check imply otherwise.
      - name: Resolve the version under test
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "DRY RUN: no tag. Reference version is tauri.conf.json's ${version}."
          else
            version="${GITHUB_REF_NAME#v}"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
            echo "TAG: ${GITHUB_REF_NAME}. Reference version is ${version}."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --- Tag ancestry -------------------------------------------------------------------
      # The tagged commit must be reachable from protected main. This is what stops a release
      # being cut from a side branch, a force-pushed ref, or a commit that never went through
      # a pull request. Equality counts (tagging main's tip is the normal case).
      #
      # Tag-only, and deliberately not faked for the dry run. There is no tag to check the
      # ancestry OF, and a dry run is a thing you may well want to start from a branch, so
      # asserting branch ancestry here would fail the runs this lane exists to enable.
      - name: Assert the tag is reachable from main
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "OK: $(git rev-parse --short HEAD) is reachable from main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at $(git rev-parse --short HEAD), which is NOT reachable from main. Refusing to release code that did not land on the protected branch."
            exit 1
          fi

      # --- Version alignment --------------------------------------------------------------
      # The version is declared in four places and stamped into the bundle from
      # tauri.conf.json. If the tag disagrees with any of them, users get an artifact whose
      # self-reported version is a lie, and the updater compares the wrong numbers.
      - name: Assert the tag matches every declared version
        shell: bash
        run: |
          tag_version="${{ steps.version.outputs.version }}"
          pkg_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          # The FOURTH source, and the easy one to forget: [workspace.package].
          # crates/reposync-core carries `version.workspace = true`, so this is the
          # version the core crate actually publishes as. The runbook's G2 lists all
          # four; a check that covered only three would pass a bump that missed this
          # one and ship a core crate whose version disagrees with the tag.
          ws_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version/{print;exit}' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"

          echo "reference (${{ steps.version.outputs.mode }}): $tag_version"
          echo "package.json:            $pkg_version"
          echo "tauri.conf.json:         $tauri_version"
          echo "src-tauri/Cargo.toml:    $cargo_version"
          echo "Cargo.toml [workspace]:  $ws_version"

          fail=0
          for pair in "package.json:$pkg_version" "tauri.conf.json:$tauri_version" "src-tauri/Cargo.toml:$cargo_version" "Cargo.toml [workspace.package]:$ws_version"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ "$value" != "$tag_version" ]; then
              echo "::error::$name declares $value but the reference version is $tag_version. Run scripts/bump-version.mjs (and re-tag, if this was a tag push)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: all version declarations agree with the reference."

      # --- Release notes exist ------------------------------------------------------------
      # The GitHub Release body is derived from CHANGELOG.md. A tag with no matching section
      # ships a release with no notes, which is how "what changed?" becomes unanswerable.
      - name: Assert CHANGELOG has a section for this version
        shell: bash
        run: |
          tag_version="${{ steps.version.outputs.version }}"
          if grep -qE "^## \[${tag_version}\]" CHANGELOG.md; then
            echo "OK: CHANGELOG.md has a section for ${tag_version}."
          else
            echo "::error::CHANGELOG.md has no '## [${tag_version}]' section. Move the [Unreleased] items into a cut section before tagging."
            exit 1
          fi

      # --- Security policy ----------------------------------------------------------------
      # A public release must tell people how to report a vulnerability privately.
      - name: Assert a security policy is published
        shell: bash
        run: |
          test -s SECURITY.md || { echo "::error::SECURITY.md is missing or empty. A public release needs a disclosure channel."; exit 1; }
          echo "OK: SECURITY.md is present."

      # --- Toolchains ---------------------------------------------------------------------
      # See the note in ci.yml: rust-toolchain.toml is the single source of truth and the
      # action does not read it, so the pin is read out and passed in.
      - name: Read the pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.rust-toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # --- The standard quality gates, re-proven on the tagged commit ---------------------
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (fast tier)
        run: cargo test --workspace

      - name: Build frontend
        run: pnpm build

      # Same assertion as CI: a contract change that was never re-exported would ship a
      # frontend type surface that lies about the backend.
      - name: Assert bindings.ts is up to date
        shell: bash
        run: |
          cargo test -p reposync --test export_bindings
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error::src/lib/bindings.ts is stale. Run the export_bindings test and commit the result."
            exit 1
          fi

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm lint
        run: pnpm lint

      - name: Assert reposync-core has no tauri dependency
        shell: bash
        run: |
          tree="$(cargo tree -p reposync-core)"
          if echo "$tree" | grep -i 'tauri'; then
            echo "::error::reposync-core depends on tauri (directly or transitively). The core crate must stay Tauri-free."
            exit 1
          fi
          echo "OK: reposync-core has no tauri dependency."

      # --- Updater config hygiene (E-18 / runbook G3) --------------------------------------
      # Asserts the committed production tauri.conf.json carries neither
      # dangerousInsecureTransportProtocol nor the disposable test pubkey - both belong only
      # to the E2E overlay. This script was written as the pre-tag gate but was never wired
      # into any workflow, so it depended on someone remembering to run it. Now it cannot be
      # skipped.
      - name: Updater production config hygiene
        run: node scripts/check-updater-config-hygiene.mjs

      # --- What a dry run did NOT prove ----------------------------------------------------
      # A green check that quietly skipped things is worse than no check, because it reads as
      # coverage nobody has. Everything this lane cannot reach is named here, in the run's own
      # output, next to the checks that did pass.
      - name: State the limits of this dry run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          {
            echo "### Release dry run"
            echo ""
            echo "Proven on this commit:"
            echo ""
            echo "- the four version declaration sites agree with each other (\`${{ steps.version.outputs.version }}\`)"
            echo "- CHANGELOG.md has a section for that version"
            echo "- SECURITY.md is present and non-empty"
            echo "- fmt, clippy, the fast test tier, typecheck, lint, and the frontend build all pass"
            echo "- bindings.ts is not stale"
            echo "- reposync-core pulls no tauri"
            echo "- the updater production config carries neither the insecure transport flag nor the test pubkey"
            echo ""
            echo "This job says nothing about the BUILD. It runs before the build jobs start, so"
            echo "listing 'both platforms build and bundle' here would have been a claim about work"
            echo "that had not happened yet. Each build job writes its own summary of what it"
            echo "actually produced; read those, and treat a missing one as a build that did not run."
            echo ""
            echo "NOT proven, and not provable without a real tag:"
            echo ""
            echo "- that the four versions match a TAG. With no tag, tauri.conf.json is the reference, so its own comparison is a tautology."
            echo "- tag ancestry from main. There is no tag to check."
            echo "- Release creation, asset upload, and updater artifact signing. No dispatch can reach those steps."
            echo "- that a signed \`latest.json\` is emitted and references the NSIS artifact. That needs the signing secret and a real cut."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dry-run build' || 'release' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # THE GATE. No preflight, no artifacts.
    needs: preflight
    # The only grant of write in this workflow, so preflight runs read-only.
    #
    # Being precise about what this does and does not buy: a dispatch DOES run this job,
    # because it shares every setup step with the real cut on purpose, so write is granted
    # during a dry run too. What keeps a dry run from publishing is not the permission set
    # but the pair of `github.event_name` guards on the two final steps, which whoever
    # starts the run cannot set. The token is threaded into the tauri-action step alone,
    # so the dry-run build step holds no credentials at all.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.rust-toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # E-18 ship-dark-safe updater signing. Only merge the release overlay (which
      # flips bundle.createUpdaterArtifacts on) when the production signing secret is
      # present; otherwise build the plain installers so a keyless tag still cuts a
      # Release (the updater ships dark). Testing `secrets.X != ''` in an env
      # expression evaluates to 'true'/'false' WITHOUT exposing the secret value.
      # ARGUMENT ORDER IS LOAD-BEARING, and it was wrong until the first dry run
      # proved it (2026-08-16, run 31930948351).
      #
      # `tauri build` takes its own flags, then `--`, then everything after that is
      # passed through to the runner (cargo). Its own help says so: "[ARGS]...
      # Command line arguments passed to the runner. Use `--` to explicitly mark
      # the start of the arguments". `--profile` is a CARGO flag; the tauri CLI has
      # no such option and rejects it outright:
      #
      #   error: unexpected argument '--profile' found
      #   tip: to pass '--profile' as a value, use '-- --profile'
      #
      # `--config` is the opposite: a tauri CLI flag, so it must come BEFORE the
      # separator. The previous value put a cargo flag first and a CLI flag second,
      # which is wrong on both counts.
      #
      # This is NOT only a dry-run problem. tauri-action's README describes `args`
      # as "additional arguments to the current tauri build command", i.e. appended
      # to the same `tauri build` invocation, so the REAL tag path carried the same
      # broken string and would have failed on the first real cut. That path still
      # cannot be executed without pushing a tag, so what is proven here is the
      # direct form; the tag form now at least uses the spelling the CLI documents
      # rather than one empirically shown to fail.
      - name: Compute updater build args
        id: updater
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "args=--config src-tauri/tauri.updater-prod.conf.json -- --profile dist" >> "$GITHUB_OUTPUT"
            echo "updater: signing key present - updater artifacts + latest.json will be produced"
          else
            echo "args=-- --profile dist" >> "$GITHUB_OUTPUT"
            echo "updater: no signing key - shipping DARK (plain installers only, no latest.json)"
          fi

      # --- DRY RUN: build and bundle, and stop ---------------------------------------------
      # Deliberately NOT tauri-action. That action's job is to create a Release and upload
      # assets, and the safest way to prove it will not is to never invoke it: there is no
      # input, flag, or misconfiguration of `pnpm tauri build` that publishes anything. Note
      # also that no GITHUB_TOKEN reaches this step's environment.
      #
      # Same `dist` profile and same computed args as the real cut, so this proves the build
      # the release would actually perform rather than a cheaper stand-in.
      - name: Build and bundle (DRY RUN, publishes nothing)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm tauri build ${{ steps.updater.outputs.args }}

      - name: Report what the dry run produced
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "### Bundles built on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # `find` rather than a hardcoded path list: the bundle layout differs per OS, and a
          # list that silently matched nothing would report success for a build that produced
          # no artifact. If this prints nothing, that is the finding.
          found=$(find target/dist/bundle target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "NOTHING FOUND under target/*/bundle. The build step reported success, so either the profile writes elsewhere or no bundle was produced. Worth investigating before trusting this lane." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$found" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- REAL CUT: only ever reachable from a v* tag push --------------------------------
      - name: Build and draft release (tauri-action)
        if: github.event_name != 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # E-18: the production updater signing material, CI-secret-only. Absent ->
          # ship dark (the compute step above leaves createUpdaterArtifacts off).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Full-LTO distribution artifacts, plus the updater overlay when signing is
          # available (see the compute step). Confirm how args are threaded (tauri CLI
          # vs cargo passthrough) and the updater/latest.json inputs against the
          # action's current README before relying on this for a real cut.
          args: ${{ steps.updater.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: RepoSync ${{ github.ref_name }}
          releaseDraft: true
          prerelease: true
          releaseBody: |
            See CHANGELOG.md for this version's notes.
            macOS build is UNSIGNED (beta). Windows is the primary supported target.
